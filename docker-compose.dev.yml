# Local dev environment: Node 24 app + MySQL + Redis.
# Run:  docker compose -f docker-compose.dev.yml up
# App:  http://localhost:3100  (Browsersync; app server/websockets on 3002)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: playtime
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-84:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdev"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      DATABASE_URL: mysql://root:dev@mysql:3306/playtime
      REDIS_URL: redis://redis:6379
      # Bind mounts from Windows don't deliver file events: poll for changes (webpack watchpack)
      WATCHPACK_POLLING: "true"
      # Test login (dev builds only): /login -> broker /go?type=dev (see src/auth)
      DEV_LOGIN: "1"
      # Центральный вход (plant-auth). Браузер редиректится на localhost:3300; сервер-к-серверу
      # (/verify) из контейнера ходит на host.docker.internal (plant-auth запущен на хосте).
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:3300}
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL:-http://host.docker.internal:3300}
      # GAME_VERIFY_SECRET / SERVICE_API_TOKEN в dev берут безопасные дефолты, если не заданы.
      GAME_VERIFY_SECRET: ${GAME_VERIFY_SECRET:-}
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:-}
      # plant-admin: приём каталога (HMAC) и сервисный GraphQL; в dev — безопасные дефолты, если пусто.
      SYNC_HMAC_SECRET: ${SYNC_HMAC_SECRET:-}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:-}
      CATALOG_SOURCE_HOSTS: ${CATALOG_SOURCE_HOSTS:-}
      # Telegram — для бонуса и привязки аккаунта (не вход). Значения из локального .env.
      PUBLIC_URL: ${PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BONUS_CHANNEL: ${TELEGRAM_BONUS_CHANNEL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    # Чтобы контейнер мог достучаться до сервисов на хосте (plant-auth :3300).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: sh -c "yarn install --network-timeout 600000 --network-concurrency 4 && yarn codegen && yarn start --silent"
    ports:
      - "3100:3000"   # host 3000 is used by another project
      - "3101:3001"
      - "3002:3002"
    volumes:
      - .:/app
      - node-modules-24:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Public HTTPS address for the local app (needed for the Telegram login widget).
  # Start with: docker compose -f docker-compose.dev.yml --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env; public hostname -> http://app:3000 in Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  # mysql-data (MySQL 5.7) is no longer used; remove with: docker volume rm game_mysql-data
  mysql-data-84:
  node-modules-24:
