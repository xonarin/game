# Local dev environment: Node 24 app + MySQL + Redis.
# Run:  docker compose -f docker-compose.dev.yml up
# App:  http://localhost:3100  (Browsersync; app server/websockets on 3002)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: playtime
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-84:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdev"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      DATABASE_URL: mysql://root:dev@mysql:3306/playtime
      REDIS_URL: redis://redis:6379
      # Bind mounts from Windows don't deliver file events: poll for changes (webpack watchpack)
      WATCHPACK_POLLING: "true"
      # Test login on /login -> /auth/dev (development builds only, see src/auth)
      DEV_LOGIN: "1"
      # Real sign-in providers: put values into a local .env file next to this one
      # (not committed). The /login page shows only the configured ones.
      PUBLIC_URL: ${PUBLIC_URL:-}
      VKID_APP_ID: ${VKID_APP_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BONUS_CHANNEL: ${TELEGRAM_BONUS_CHANNEL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Central auth broker (src/authservice)
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:3300}
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL:-http://authservice:3300}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: sh -c "yarn install --network-timeout 600000 --network-concurrency 4 && yarn codegen && yarn start --silent"
    ports:
      - "3100:3000"   # host 3000 is used by another project
      - "3101:3001"
      - "3002:3002"
    volumes:
      - .:/app
      - node-modules-24:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Admin panel backend (separate app/process, shares the same DB/Redis — see src/admin).
  # In production this runs on its own server/domain; here it is a separate service on :3200.
  admin:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      DATABASE_URL: mysql://root:dev@mysql:3306/playtime
      REDIS_URL: redis://redis:6379
      DEV_LOGIN: "1"
      # Admin domain public URL (for OAuth redirect URIs in production)
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      # Same social providers as the game, used on the admin domain for admin-only login
      PUBLIC_URL: ${PUBLIC_URL:-}
      VKID_APP_ID: ${VKID_APP_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:3300}
      AUTH_SERVICE_INTERNAL_URL: ${AUTH_SERVICE_INTERNAL_URL:-http://authservice:3300}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Reuses the app's installed node_modules and generated types; waits for them on first boot.
    command: >
      sh -c "until [ -x node_modules/.bin/babel-node ] && [ -f src/__generated__/graphql.tsx ]; do
      echo 'admin: waiting for app install/codegen...'; sleep 3; done;
      (cd src/admin/client && yarn install --network-timeout 600000 && yarn build);
      BABEL_DISABLE_CACHE=1 node_modules/.bin/babel-node --extensions '.ts,.tsx' src/admin/server.ts"
    ports:
      - "3200:3200"
    volumes:
      - .:/app
      - node-modules-24:/app/node_modules
      # The admin SPA installs its own deps here (in-container, not the Windows bind mount)
      - admin-client-node-modules:/app/src/admin/client/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started

  # Central auth broker (src/authservice): owns all social-login flows; sites delegate to it.
  # In production runs on its own domain (auth.<domain>); here a separate service on :3300.
  authservice:
    image: node:24-bookworm-slim
    working_dir: /app
    environment:
      DATABASE_URL: mysql://root:dev@mysql:3306/playtime
      REDIS_URL: redis://redis:6379
      DEV_LOGIN: "1"
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:3300}
      AUTH_SHARED_SECRET: ${AUTH_SHARED_SECRET:-}
      # All social providers live here (one domain registered with each provider)
      VKID_APP_ID: ${VKID_APP_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: >
      sh -c "until [ -x node_modules/.bin/babel-node ] && [ -f src/__generated__/graphql.tsx ]; do
      echo 'authservice: waiting for app install/codegen...'; sleep 3; done;
      BABEL_DISABLE_CACHE=1 node_modules/.bin/babel-node --extensions '.ts,.tsx' src/authservice/server.ts"
    ports:
      - "3300:3300"
    volumes:
      - .:/app
      - node-modules-24:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started

  # Public HTTPS address for the local app (needed for the Telegram login widget).
  # Start with: docker compose -f docker-compose.dev.yml --profile tunnel up -d
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env; public hostname -> http://app:3000 in Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  # mysql-data (MySQL 5.7) is no longer used; remove with: docker volume rm game_mysql-data
  mysql-data-84:
  node-modules-24:
  admin-client-node-modules:
