
type Query {
    availablePaymentMethods: [PaymentMethod!]!
    availableWithdrawMethods: [PaymentMethod!]!
}

type Mutation {
    makeDeposit(amount: Float!, method: ID!): String!
}

type PaymentMethod {
    id: ID!
    name: String!
    avatar: URL!
    commission: Float!
    minAmount: Float!
    maxAmount: Float!
    enabled: Boolean!
}
