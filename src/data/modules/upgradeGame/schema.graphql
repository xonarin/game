# Режим «Апгрейд». Исход — только из provably fair броска (serverSeed, clientSeed, nonce)
# и окна выигрыша, посчитанного до броска; проверка — services/upgrade/game.ts.

type Query {
    upgradeConfigUPG: UpgradeConfigUPG!
    inventoryUPG: [InventoryItemUPG!]!
    # Предметы магазина / цели апгрейда: поиск, цена от/до, сортировка, страница
    upgradeItemsUPG(filter: ItemsFilterUPG!): ItemsPageUPG!
    # Один предмет с текущей ценой (null — нет в продаже): свежая цена выбранной цели
    upgradeItemUPG(id: ID!): ItemUPG
    # Админка: статистика за период [from, to); без границ — за всё время
    adminUpgradeStats(from: DateTime, to: DateTime): AdminUpgradeStats!
    # Админка: симуляция апгрейдов теми же функциями, что игра; без базы и денег
    adminSimulateUpgrade(input: AdminSimulateUpgradeInput!): AdminUpgradeSimulation!
    # Админка: игроки с начальным балансом играют раунды, ставя из остатка
    adminSimulateUpgradePlayers(input: AdminSimulateUpgradePlayersInput!): AdminUpgradePlayersSimulation!
    # История апгрейдов игрока, новые первыми
    upgradeHistoryUPG(limit: Int, offset: Int): [UpgradeGameUPG!]!
}

type Mutation {
    playGameUPG(input: PlayGameUPGInput!): PlayGameUPGPayload!
    # Покупка нескольких скинов: всего не больше upgradeConfigUPG.maxBuyUnits единиц
    buyItemsUPG(items: [BuyItemUPGInput!]!): [InventoryItemUPG!]!
}

type UpgradeConfigUPG {
    # Шанс = (1 / множитель) × frontendCoef
    frontendCoef: Float!
    # Пределы стоимости ставки (монеты + скин)
    minBet: Float!
    maxBet: Float!
    # Нижняя граница списка целей: от стоимости ставки × targetItemMarkup (игру не ограничивает)
    targetItemMarkup: Float!
    # Пределы шанса: игра разрешена при minChance <= шанс <= maxChance
    minChance: Float!
    maxChance: Float!
    # Шкала броска: 0 … rollRange - 1
    rollRange: Int!
    # Сколько единиц можно купить за раз (сумма количеств)
    maxBuyUnits: Int!
    # Сколько своих скинов можно поставить в одну игру
    maxBetItems: Int!
}

enum ItemsSortUPG {
    PRICE_ASC
    PRICE_DESC
}

input ItemsFilterUPG {
    # Слова названия, без учёта регистра
    search: String
    minPrice: Float
    maxPrice: Float
    sort: ItemsSortUPG
    # По умолчанию 20, не больше 60
    limit: Int
    offset: Int
}

type ItemsPageUPG {
    items: [ItemUPG!]!
    # Сколько всего предметов подходит под фильтр
    total: Int!
}

input BuyItemUPGInput {
    itemId: ID!
    quantity: Int!
}

type ItemUPG {
    id: ID!
    name: String!
    imageUrl: String!
    # Монеты (1 монета = 1 USD)
    price: Float!
    type: String!
    exterior: String
    rarityColor: String
}

type InventoryItemUPG {
    id: ID!
    item: ItemUPG!
    priceAtAcquisition: Float!
    # Сколько скин стоит в ставке сейчас
    value: Float!
    # Скин занят (на выводе или в другом режиме): поставить нельзя
    locked: Boolean!
}

input PlayGameUPGInput {
    # Монеты к ставке, может быть 0, если ставится скин
    betAmount: Float!
    # Свои скины в ставку (id из inventoryUPG), не больше maxBetItems
    betItemIds: [ID!]
    targetItemId: ID!
    # Множитель, который видел игрок; сервер считает свой по ценам и отклоняет при расхождении
    targetMultiplier: Float!
}

type PlayGameUPGPayload {
    win: Boolean!
    roll: Int!
    winStart: Int!
    winEnd: Int!
    chance: Float!
    multiplier: Float!
    # Хэш серверного сида (sha256): сам сид раскрывается только при смене (updateServerSeed)
    serverSeedHash: String!
    clientSeed: String!
    nonce: Int!
    gameId: ID!
    # Новый скин в инвентаре при победе
    wonItemId: ID
    wonItem: InventoryItemUPG
    # Скины ставки: ушли из инвентаря в любом исходе (обменяны на выигрыш или сгорели)
    spentItemIds: [ID!]!
}

# Сыгранный апгрейд: снимок ставки и цели на момент игры и данные для проверки исхода
type UpgradeGameUPG {
    id: ID!
    createdAt: DateTime!
    betAmount: Float!
    # Поставленные скины: предмет и стоимость в ставке на момент игры
    betItems: [UpgradeBetItemUPG!]!
    betItemsValue: Float!
    betValue: Float!
    targetItem: ItemUPG!
    targetPrice: Float!
    multiplier: Float!
    chance: Float!
    roll: Int!
    winStart: Int!
    winEnd: Int!
    win: Boolean!
    clientSeed: String!
    serverSeedHash: String!
    # Раскрывается, когда игрок сменил серверный сид (updateServerSeed); до этого null
    serverSeed: String
    nonce: Int!
}

type UpgradeBetItemUPG {
    item: ItemUPG!
    value: Float!
}

# Статистика апгрейда за период. Суммы в монетах; ставка включает стоимость поставленных скинов
type AdminUpgradeStats {
    # Сколько разных игроков сыграло
    players: Int!
    games: Int!
    wins: Int!
    losses: Int!
    betTotal: Float!
    # Цена выигранных скинов
    payoutTotal: Float!
    # Доход сайта: betTotal - payoutTotal
    profit: Float!
    # Фактический RTP: payoutTotal / betTotal; null — ставок не было
    rtp: Float
}

input AdminSimulateUpgradeInput {
    # 1 … 1 000 000
    games: Int!
    # Стоимость ставки, монеты
    bet: Float!
    # Шанс каждой игры — случайный в [chanceFrom, chanceTo] (доли 0…1); равные — фиксированный
    chanceFrom: Float!
    chanceTo: Float!
    # Коэффициент шанса (RTP); по умолчанию — из настроек
    frontendCoef: Float
}

type AdminUpgradeSimulation {
    games: Int!
    wins: Int!
    losses: Int!
    betTotal: Float!
    payoutTotal: Float!
    profit: Float!
    # RTP симуляции и ожидаемый (без случайности)
    rtp: Float!
    expectedRtp: Float!
    frontendCoef: Float!
    durationMs: Int!
    # Те же ставки, если бы все играли с одним шансом: 80 %, 70 % … 10 %
    byChance: [AdminUpgradeSimulationChance!]!
}

type AdminUpgradeSimulationChance {
    chance: Float!
    wins: Int!
    payoutTotal: Float!
    profit: Float!
    rtp: Float!
}

enum AdminSimulationBetMode {
    # Фиксированная ставка за раунд (или остаток баланса, если меньше)
    FIXED
    # Весь баланс каждый раунд
    ALL_IN
    # Случайная сумма от минимальной ставки до всего баланса, каждый раунд заново
    RANDOM
}

input AdminSimulateUpgradePlayersInput {
    # 1 … 1 000 000; игроки × раунды — не больше 5 000 000
    players: Int!
    startBalance: Float!
    rounds: Int!
    betMode: AdminSimulationBetMode!
    # Только для FIXED
    bet: Float
    chanceFrom: Float!
    chanceTo: Float!
    # По умолчанию — из настроек
    frontendCoef: Float
    # Вывод при росте баланса (доля): 0.5 — игрок выводит всё и уходит при балансе ≥ начальный × 1.5; null — не выводит
    cashOutGrowth: Float
}

type AdminUpgradePlayersRound {
    round: Int!
    activePlayers: Int!
    turnover: Float!
    payout: Float!
    profit: Float!
    cumulativeProfit: Float!
    # У ещё играющих (выведенное не входит)
    playersBalance: Float!
    # Вывели к концу раунда, всего: игроков и монет
    cashedOutPlayers: Int!
    withdrawn: Float!
}

type AdminUpgradePlayersSimulation {
    players: Int!
    rounds: Int!
    # Сколько игроки принесли
    deposited: Float!
    # Сумма всех ставок
    turnover: Float!
    payout: Float!
    profit: Float!
    profitShareOfDeposits: Float!
    profitShareOfTurnover: Float!
    rtp: Float!
    # Сколько осталось у тех, кто не вывел
    playersBalance: Float!
    brokePlayers: Int!
    # Сколько игроков вывели и сколько монет ушло выводами
    cashedOutPlayers: Int!
    withdrawn: Float!
    byRound: [AdminUpgradePlayersRound!]!
    frontendCoef: Float!
    minBet: Float!
    durationMs: Int!
}
