schema {
    query: Query
    mutation: Mutation
    subscription: Subscription
}

type Query {
    minesGameConfiguration: MinesGameConfiguration!
    activeMinesGame: MinesGame
    minesGameHistory: [MinesGameHistory]
}

type Mutation {
    startMinesGame(input: StartMinesGameInput!): MinesGame!
    endMinesGame: MinesGame!
    makeMinesGameStep(cell: Int!): MinesGame!
}

enum MinesGameStatus {
    InGame
    Ended
}

type MinesGameConfiguration {
    fieldSize: Int!
    minBombsCount: Int!
    coefs: [[Float!]!]!
}

type Subscription {
    minesGameBet: MinesGameHistory
}

type MinesGameHistory {
    id: ID!
    userId: ID!
    betAmount: Float!
    winAmount: Float!
    bombsCount: Float!
    createdAt: DateTime!
}

type MinesGame {
    id: ID!
    betAmount: Float!
    winAmount: Float!
    bombsCount: Int!
    fieldConf: Int!
    stepsConf: Int!
    status: MinesGameStatus!
}

input StartMinesGameInput {
    betAmount: Float!
    bombsCount: Int!
}
