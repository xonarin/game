# Internal service API, consumed server-to-server by the central auth service (plant-auth)
# over the shared /graphql endpoint, authenticated with `X-Service-Token` (see isService rule).
# plant-auth runs the social providers and has no DB access; it resolves users through here.

type ResolveSocialUserPayload {
    id: ID!
    username: String!
    avatar: String!
    isNew: Boolean!
}

type Query {
    # Is this origin on the broker allowlist ("Домены", managed in the admin panel)?
    serviceIsAllowedOrigin(origin: String!): Boolean!
}

type Mutation {
    # Finds the user for this social identity or registers a new one. For a Telegram identity it
    # also links the Telegram id to the account (for the bonus), mirroring the old direct login.
    serviceResolveSocialUser(type: String!, socialId: String!, username: String!, avatar: String!): ResolveSocialUserPayload!
}
