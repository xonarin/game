# Каталог скинов и расписания фоновых задач — для админки (plant-admin).
# Чтение: админ (Bearer game-JWT через BFF) ИЛИ сервер админки без сессии (X-Admin-Service-Token, крон).
# Изменение расписания — только админ. Сам приём каталога — REST /internal/sync/* (HMAC), не здесь.
# Даты — DateTime (ISO 8601, UTC); скаляр объявлен в модуле admin.

type CronJob {
    key: String!
    # Стандартный 5-полевой cron
    cronExpression: String!
    # IANA, например Asia/Tashkent
    timezone: String!
    enabled: Boolean!
    lastRunAt: DateTime
    lastRunStatus: String
    updatedAt: DateTime!
}

type SyncRun {
    runId: String!
    # catalog / prices
    kind: String!
    # Магазин прогона цен; null у каталога
    marketCode: String
    # manual / cron
    trigger: String!
    # running / ok / failed / skipped (цены: снимок не применён защитой minRowsRatio)
    status: String!
    startedAt: DateTime!
    finishedAt: DateTime
    batchesExpected: Int!
    batchesReceived: Int!
    rowsReceived: Int!
    # Каталог: добавлено строк Item. Цены: новых строк market_price
    rowsInserted: Int!
    # Каталог: обновлено строк Item. Цены: предметов, у которых изменились price / is_available
    rowsUpdated: Int!
    sourceTotal: Int!
    duplicatesCollapsed: Int!
    # Цены: совпало с каталогом / ушло в несовпавшие / удалено (нет в снимке) / изменились min_price или qty
    rowsMatched: Int!
    rowsUnmatched: Int!
    rowsRemoved: Int!
    rowsChanged: Int!
    error: String
}

type CatalogCategoryCount {
    category: String!
    count: Int!
}

type CatalogTypeCount {
    # skin / sticker / crate / … (префикс id ByMykel)
    type: String!
    count: Int!
}

# Предмет каталога для таблицы админки
type CatalogItem {
    id: ID!
    # skin / sticker / crate / …
    type: String!
    marketHashName: String!
    # skin: Knives, Rifles …; остальные — подтип ByMykel
    category: String
    # FN / MW / FT / WW / BS или null
    exterior: String
    stattrak: Boolean!
    souvenir: Boolean!
    rarity: String
    rarityColor: String
    image: String!
    # USD с наценкой, строкой ("85.10"); null — нет ни у одного включённого магазина
    price: String
    isAvailable: Boolean!
    priceUpdatedAt: DateTime
}

type CatalogItemPage {
    total: Int!
    items: [CatalogItem!]!
}

type CatalogStats {
    total: Int!
    byType: [CatalogTypeCount!]!
    # Только скины (type = skin): Knives, Rifles …
    byCategory: [CatalogCategoryCount!]!
    lastSuccessfulImportAt: DateTime
}

type Query {
    cronJobs: [CronJob!]!
    cronJob(key: String!): CronJob
    # Последние прогоны, новые сверху; limit 1…100, по умолчанию 20.
    # marketCode — только прогоны цен этого магазина (неизвестный код — пустой список)
    syncRuns(kind: String = "catalog", marketCode: String, limit: Int = 20): [SyncRun!]!
    catalogStats: CatalogStats!
    # Таблица предметов: search — слова через пробел (подстрока, без учёта регистра);
    # exteriors — FN / MW / FT / WW / BS; minPrice / maxPrice — USD строкой ("10" или "10.50");
    # available — true: в наличии, false: нет в наличии, null: все;
    # sort — name_asc / price_asc / price_desc / exterior_asc / exterior_desc /
    # available_first / unavailable_first / updated_desc / updated_asc; limit 1…100.
    # Ошибка ввода — UserError с extensions.field
    catalogItems(
        search: String
        exteriors: [String!]
        minPrice: String
        maxPrice: String
        available: Boolean
        sort: String = "name_asc"
        limit: Int = 50
        offset: Int = 0
    ): CatalogItemPage!
    # Источник импорта (настройка catalog::sourceUrl); правится через adminUpdateSetting.
    # Недопустимое значение (не https / хост вне CATALOG_SOURCE_HOSTS) — UserError
    catalogSourceUrl: String!
}

type Mutation {
    # Ошибка валидации — UserError с понятным текстом и extensions.field (cronExpression / timezone / key)
    updateCronJob(key: String!, cronExpression: String!, timezone: String!, enabled: Boolean!): CronJob!
}
