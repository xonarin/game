# Магазины скинов и их цены — для админки (plant-admin).
# Чтение: админ (Bearer game-JWT через BFF) ИЛИ сервер админки без сессии (X-Admin-Service-Token).
# Изменение — только админ. Сам приём снимков цен — REST POST /internal/sync/prices/:market (HMAC).
# Деньги — строки с 2 знаками ("81.05"); даты — DateTime (UTC), скаляр объявлен в модуле admin.

type Market {
    # 'lisskins'
    code: String!
    name: String!
    # Маркет включён: синхронизация разрешена. false — не синхронизируется и цены не используются
    # (собранные цены не удаляются)
    enabled: Boolean!
    # Цены маркета разрешено использовать в расчётах (Item.price); на синхронизацию не влияет.
    # Используются только при enabled && isPriceSourceEnabled
    isPriceSourceEnabled: Boolean!
    # ISO 4217 — валюта minPrice
    currency: String!
    # Порядок при равной цене: меньше — раньше
    priority: Int!
    # "0.70": снимок меньше ratio × прошлого успешного не применяется
    minRowsRatio: String!
    # Несекретные настройки адаптера, JSON-объект строкой
    settings: String!
    lastSyncAt: DateTime
    # ok / failed / skipped
    lastSyncStatus: String
    updatedAt: DateTime!
}

# Строка market_price маркета (любого: и используемого, и нет)
type ItemOffer {
    marketCode: String!
    marketName: String!
    currency: String!
    priority: Int!
    # В валюте магазина
    minPrice: String!
    priceUsd: String!
    qty: Int!
    priceChangedAt: DateTime!
    marketEnabled: Boolean!
    isPriceSourceEnabled: Boolean!
    # Цена участвует в Item.price (marketEnabled && isPriceSourceEnabled)
    used: Boolean!
}

type UnmatchedName {
    marketCode: String!
    marketHashName: String!
    # USD, из последнего снимка
    lastPrice: String!
    firstSeen: DateTime!
    lastSeen: DateTime!
    ignored: Boolean!
}

type UnmatchedNamePage {
    total: Int!
    items: [UnmatchedName!]!
}

type Query {
    markets: [Market!]!
    market(code: String!): Market
    # Дорогие сверху; limit 1…500
    unmatchedNames(marketCode: String!, limit: Int = 50, offset: Int = 0, includeIgnored: Boolean = false): UnmatchedNamePage!
    # Цены предмета у всех маркетов: сначала используемые (по priceUsd, затем priority — первая и даёт цену
    # предмета), затем неиспользуемые (маркет выключен или его цены запрещены)
    itemOffers(itemId: ID!): [ItemOffer!]!
    # Текущая наценка (настройка prices::markup), доля строкой: "0.0500" = 5 %
    priceMarkup: String!
}

type Mutation {
    # enabled и isPriceSourceEnabled меняются независимо; цены маркета при этом не удаляются —
    # если изменилось «цены используются», затронутые предметы пересчитываются в той же транзакции.
    # Ошибка валидации — UserError с extensions.field
    updateMarket(
        code: String!
        enabled: Boolean
        isPriceSourceEnabled: Boolean
        priority: Int
        minRowsRatio: String
        settings: String
    ): Market!
    setUnmatchedIgnored(marketCode: String!, marketHashName: String!, ignored: Boolean!): UnmatchedName!
}
